[project]
name = "web"
aliases = ["gway-web"]

[adapter]
type = "python"
module = "gway_web.commands"

[variables.logs]
source = "~/.local/state/gway/runs"

[services.logs]
description = "GWAY Web authenticated log service"
command = ["{python}", "-m", "gway_web.log_service", "--source", "[logs.source]"]
restart = "on-failure"

[services.api]
description = "GWAY Web authenticated single-call API"
command = ["{python}", "-m", "gway_web.api_service"]
restart = "on-failure"
